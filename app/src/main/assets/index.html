<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캡차 프로토타입</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stagewrap">
    <div id="disp">

      <div class="sbar">
        <div class="sl">
          <span id="i-lock"></span>
          <span class="search"><span id="i-search"></span>검색</span>
          <span class="ptag" id="ptag">프로토타입, 차량 데이터는 시뮬레이터 값</span>
        </div>
        <div class="sr">
          <span id="i-status"></span>
          <span class="prof" id="i-user"></span>
          <span id="clock">오후 6:50</span>
        </div>
      </div>

      <div class="dview">
        <div class="dv-lab">주행 뷰</div>
        <div class="gearrow">
          <b id="g-P" data-gear="P">P</b>
          <b id="g-R" data-gear="R">R</b>
          <b id="g-N" data-gear="N">N</b>
          <b id="g-D" data-gear="D">D</b>
        </div>
        <div class="spd"><span id="dv-speed">0</span><em>km/h</em></div>
        <div class="dv-car">
          <svg width="132" height="236" viewBox="0 0 132 236" aria-hidden="true">
            <rect x="16" y="8" width="100" height="220" rx="40" fill="#CDD4DC"/>
            <rect x="5" y="66" width="13" height="20" rx="6" fill="#B2BCC7"/>
            <rect x="114" y="66" width="13" height="20" rx="6" fill="#B2BCC7"/>
            <path d="M30 70 Q66 48 102 70 L96 104 H36 Z" fill="#8E9AA8"/>
            <rect x="34" y="110" width="64" height="50" rx="10" fill="#E3E8ED"/>
            <path d="M36 166 H96 L100 188 Q66 200 32 188 Z" fill="#8E9AA8"/>
            <rect x="28" y="14" width="22" height="8" rx="4" fill="#fff"/>
            <rect x="82" y="14" width="22" height="8" rx="4" fill="#fff"/>
            <rect x="28" y="214" width="22" height="7" rx="3.5" fill="#E9A0A0"/>
            <rect x="82" y="214" width="22" height="7" rx="3.5" fill="#E9A0A0"/>
          </svg>
        </div>
        <div class="dv-kv">
          <div><span id="i-fuel"></span><b>312km</b></div>
          <div><span id="i-temp"></span><b>8°C</b></div>
        </div>
      </div>

      <div class="gnb">
        <span class="temp" id="t-l"></span>
        <div class="slots" id="slots"></div>
        <span class="temp" id="t-r"></span>
      </div>

      <div class="appwin" id="appwin"></div>
      <div class="toast" id="toast"><span id="toastt"></span></div>

    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/car.js"></script>
<script src="js/understand.js"></script>
<script src="js/capture.js"></script>
<script src="js/screen-drive.js"></script>
<script src="js/screen-cards.js"></script>
<script src="js/screen-report.js"></script>
<script src="js/screen-detail.js"></script>
<script src="js/voice.js"></script>
<script src="js/buttons.js"></script>
<script src="js/main.js"></script>
</body>
</html>
